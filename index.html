<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071426"><title>PRAC Super Match Manager</title><style>
*{box-sizing:border-box}body{margin:0;background:#071426;color:#fff;font-family:system-ui,-apple-system,Arial}.wrap{max-width:900px;margin:auto;padding:16px}.hero{text-align:center;padding:15px}.hero h1{margin:0;font-size:clamp(28px,7vw,48px)}.hero span{color:#ef3f46}.hero p{color:#9fb1c7}.card,.match{background:#0e2138;border:1px solid #294765;border-radius:16px;padding:15px;margin:13px 0}h2{margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;color:#a9b9cb;font-size:12px;font-weight:800;margin-bottom:5px}input,select{width:100%;padding:12px;background:#08182b;color:#fff;border:1px solid #35516f;border-radius:10px;font-size:16px}button{border:0;border-radius:10px;padding:11px 14px;background:#168ff2;color:#fff;font-weight:800;font-size:15px}.danger{background:#a72d36}.gray{background:#29445f}.head,.actions,.score{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:13px 0}.ath{text-align:center;background:#08182b;border-radius:12px;padding:12px 6px}.ath small{display:block;color:#9fb1c7;margin-top:4px}.vsb{font-weight:1000;color:#ef3f46}.score{justify-content:center}.score b{font-size:28px;min-width:75px;text-align:center}.winner{outline:2px solid #ffc857}.status{color:#ffc857;font-weight:900}.empty{text-align:center;color:#9fb1c7;padding:22px}.note{font-size:12px;color:#9fb1c7}.count{color:#ffc857;font-size:14px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><div class="hero"><h1><span>PRAC</span> Super Match Manager</h1><p>Puerto Rico Armwrestling Championship</p></div>
<div class="card"><h2>Evento</h2><div class="grid"><div><label>Nombre del evento</label><input id="event" value="PRAC Super Match Series"></div><div><label>Fecha</label><input id="date" type="date"></div></div></div>
<div class="card"><h2>Añadir Super Match <span class="count" id="count">0 / 5</span></h2><div class="grid">
<div><label>Atleta 1</label><input id="a1" placeholder="Nombre"></div><div><label>Equipo 1</label><input id="t1" placeholder="Equipo / No Team"></div>
<div><label>Atleta 2</label><input id="a2" placeholder="Nombre"></div><div><label>Equipo 2</label><input id="t2" placeholder="Equipo / No Team"></div>
<div><label>Mano</label><select id="hand"><option>Derecha</option><option>Izquierda</option></select></div><div><label>Formato</label><select id="need"><option value="3">Mejor de 5</option><option value="2">Mejor de 3</option><option value="4">Mejor de 7</option></select></div></div>
<p><button id="add">+ Añadir match</button></p><div class="note">Máximo 5 super matches. La cartelera y los resultados se guardan automáticamente en este dispositivo.</div></div>
<div class="card"><div class="head"><h2>Cartelera / Matches</h2><button class="danger" id="clear">Borrar todo</button></div><div id="list"></div></div></div>
<script>
const K='prac-sm-v2',$=x=>document.getElementById(x);let d={event:'PRAC Super Match Series',date:'',m:[]};function e(s){return String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function save(){d.event=$('event').value;d.date=$('date').value;localStorage.setItem(K,JSON.stringify(d))}
function render(){$('count').textContent=d.m.length+' / 5';if(!d.m.length){$('list').innerHTML='<div class="empty">Todavía no hay atletas. Añade el primer super match arriba.</div>';return}$('list').innerHTML=d.m.map((m,i)=>{let done=m.s1>=m.need||m.s2>=m.need;return `<div class="match"><div class="head"><b>Match ${i+1}</b><span>${e(m.hand)} · Mejor de ${m.need*2-1}</span></div><div class="vs"><div class="ath ${m.s1>=m.need?'winner':''}"><b>${e(m.a1)}</b><small>${e(m.t1||'No Team')}</small></div><div class="vsb">VS</div><div class="ath ${m.s2>=m.need?'winner':''}"><b>${e(m.a2)}</b><small>${e(m.t2||'No Team')}</small></div></div><div class="score"><button class="gray" onclick="sc(${i},1,-1)">−</button><button onclick="sc(${i},1,1)">+</button><b>${m.s1} - ${m.s2}</b><button onclick="sc(${i},2,1)">+</button><button class="gray" onclick="sc(${i},2,-1)">−</button></div><div class="actions">${done?`<span class="status">GANADOR: ${e(m.s1>=m.need?m.a1:m.a2)}</span>`:''}<button class="gray" onclick="rs(${i})">Reiniciar</button><button class="danger" onclick="rm(${i})">Eliminar</button></div></div>`}).join('')}
function sc(i,p,x){let m=d.m[i];if((m.s1>=m.need||m.s2>=m.need)&&x>0)return;let k=p==1?'s1':'s2';m[k]=Math.max(0,m[k]+x);save();render()}function rs(i){d.m[i].s1=d.m[i].s2=0;save();render()}function rm(i){if(confirm('¿Eliminar este match?')){d.m.splice(i,1);save();render()}}
$('add').onclick=()=>{if(d.m.length>=5)return alert('El máximo es 5 matches.');let a1=$('a1').value.trim(),a2=$('a2').value.trim();if(!a1||!a2)return alert('Escribe ambos atletas.');d.m.push({a1:a1,t1:$('t1').value.trim(),a2:a2,t2:$('t2').value.trim(),hand:$('hand').value,need:+$('need').value,s1:0,s2:0});['a1','t1','a2','t2'].forEach(x=>$(x).value='');save();render()};$('clear').onclick=()=>{if(confirm('¿Borrar todos los matches?')){d.m=[];save();render()}};$('event').oninput=save;$('date').onchange=save;try{let x=JSON.parse(localStorage.getItem(K));if(x)d=x}catch(x){}$('event').value=d.event;$('date').value=d.date;render();
</script></body></html>
